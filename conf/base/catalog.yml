# Here you can define all your datasets by using simple YAML syntax.
#
# Documentation for this file format can be found in "The Data Catalog"
# Link: https://docs.kedro.org/en/stable/data/data_catalog.html

# --- 01_raw: CIC-IDS2017 MachineLearningCSV (scripts/download_data.py) ---
# Zakres minimum: 2 dni ruchu - poniedzialek (tylko BENIGN) i piatek (BENIGN + ataki)
_csv: &csv
  type: pandas.CSVDataset
  load_args:
    skipinitialspace: true
    low_memory: false

# trening detektora anomalii - wylacznie ruch normalny
raw_monday:
  <<: *csv
  filepath: data/01_raw/Monday-WorkingHours.pcap_ISCX.csv

# walidacja / test - ruch mieszany z atakami
raw_friday_morning:        # Botnet (Ares)
  <<: *csv
  filepath: data/01_raw/Friday-WorkingHours-Morning.pcap_ISCX.csv

raw_friday_portscan:       # PortScan
  <<: *csv
  filepath: data/01_raw/Friday-WorkingHours-Afternoon-PortScan.pcap_ISCX.csv

raw_friday_ddos:           # DDoS (LOIC)
  <<: *csv
  filepath: data/01_raw/Friday-WorkingHours-Afternoon-DDos.pcap_ISCX.csv
