# Here you can define all your datasets by using simple YAML syntax.
#
# Documentation for this file format can be found in "The Data Catalog"
# Link: https://docs.kedro.org/en/stable/data/data_catalog.html

# --- 01_raw: HAI 21.03 (scripts/download_data.py) ---
_csv_gz: &csv_gz
  type: pandas.CSVDataset
  load_args:
    compression: gzip

raw_train1:   # 60 h, tylko ruch normalny
  <<: *csv_gz
  filepath: data/01_raw/train1.csv.gz

raw_test1:    # 12 h, 5 atakow
  <<: *csv_gz
  filepath: data/01_raw/test1.csv.gz

raw_test2:    # 33 h, 20 atakow
  <<: *csv_gz
  filepath: data/01_raw/test2.csv.gz

# --- 08_reporting: tabele z EDA ---
_report: &report
  type: pandas.CSVDataset
  save_args:
    index: false

eda_file_summary:
  <<: *report
  filepath: data/08_reporting/eda_file_summary.csv

eda_column_summary:
  <<: *report
  filepath: data/08_reporting/eda_column_summary.csv

eda_attack_episodes:
  <<: *report
  filepath: data/08_reporting/eda_attack_episodes.csv

# --- wykresy: w docs/figures, bo dolaczamy je do docs/eda_report.md ---
_figure: &figure
  type: matplotlib.MatplotlibDataset
  save_args:
    dpi: 90
    bbox_inches: tight

eda_fig_histograms:
  <<: *figure
  filepath: docs/figures/histograms.png

eda_fig_boxplots:
  <<: *figure
  filepath: docs/figures/boxplots.png

eda_fig_counts:
  <<: *figure
  filepath: docs/figures/counts.png

eda_fig_correlation:
  <<: *figure
  filepath: docs/figures/correlation.png

eda_fig_pairplot:
  <<: *figure
  filepath: docs/figures/pairplot.png

eda_fig_attack_example:
  <<: *figure
  filepath: docs/figures/attack_example.png
